e>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section-space light-section\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading-row compact\">\u003cdiv>\u003cdiv class=\"section-kicker\">HOW IT WORKS\u003c/div>\u003ch2>Three clear steps to get started.\u003c/h2>\u003c/div>\u003cp class=\"section-sidecopy\">No clutter, no confusion. Just a straightforward path into French.\u003c/p>\u003c/div>\u003cdiv class=\"steps-clean\">\u003carticle class=\"step-clean\">\u003cspan>01\u003c/span>\u003ch3>Book an introductory lesson\u003c/h3>\u003cp>Tell us about your goals and schedule a free first conversation.\u003c/p>\u003c/article>\u003carticle class=\"step-clean\">\u003cspan>02\u003c/span>\u003ch3>Choose the right format\u003c/h3>\u003cp>Select private, group, or intensive lessons based on your learning style and pace.\u003c/p>\u003c/article>\u003carticle class=\"step-clean\">\u003cspan>03\u003c/span>\u003ch3>Start building fluency\u003c/h3>\u003cp>Meet regularly, practice consistently, and grow your confidence with guidance from your teacher.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"pricing-teaser\">\u003cdiv class=\"pricing-teaser-copy\">\u003cdiv class=\"section-kicker\">PRICING\u003c/div>\u003ch2>Choose the format that suits you best.\u003c/h2>\u003cp>Whether you prefer group classes, one-on-one support, or a more intensive schedule, YoLingo offers a clear plan for each type of learner.\u003c/p>\u003ca class=\"button button-primary\" href=\"pricing.html\">See all plans\u003c/a>\u003c/div>\u003cdiv class=\"pricing-mini-grid\">\u003carticle class=\"pricing-mini-card\">\u003ch3>Group Classes\u003c/h3>\u003cp>For learners who enjoy shared momentum and guided conversation practice.\u003c/p>\u003cstrong>$149\u003c/strong>\u003cspan>per 4 weeks\u003c/span>\u003c/article>\u003carticle class=\"pricing-mini-card featured\">\u003ch3>Private Lessons\u003c/h3>\u003cp>For learners who want personal attention, tailored lessons, and flexible scheduling.\u003c/p>\u003cstrong>$249\u003c/strong>\u003cspan>per 4 weeks\u003c/span>\u003c/article>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"final-cta section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"final-cta-panel refined\">\u003cdiv class=\"final-cta-text\">\u003cdiv class=\"section-kicker light\">\u003cspan>READY TO BEGIN\u003c/span>\u003c/div>\u003ch2>Your first French conversation starts here.\u003c/h2>\u003cp>Book a free introductory lesson and see how YoLingo can help you build confidence in French.\u003c/p>\u003cdiv class=\"final-buttons\">\u003ca class=\"button button-white\" href=\"contact.html?service=free-trial\">Book a free lesson\u003c/a>\u003ca class=\"button button-outline-light\" href=\"pricing.html\">View pricing\u003c/a>\u003c/div>\u003c/div>\u003cimg alt=\"YoLingo mascot\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRjSEAABXRUJQVlA4WAoAAAAQAAAAfAIAxAIAQUxQSL0MAAABhyAQIBzwP2whIpJOCuM2ksLMbv9dc8DdkvwjYgK4dmIBWCnA0K16iXFri5sb3P6MB3P8Pc7x9zjHova86gAHATgyR5IyMrVGsGRSBoAkFFEGbJljWzBxOcFhlCGhzqGLhxCx2hdam2hgiMCcX6Vo23bctjmYCM7E//+uZFsEHuDHl6SN6P8ESHDbSJIk5133+P8/nq3IjChjFojof1CQJMltJFlLtADQ8f8Hn9i9O1TmqYj+TwD/+/9/b5d2zuGXzzmuq/fOOed936cWK/Eh5e0sVZ9zDqzZq3lM63mVpuecM/lFmvejCHqeNWoxiXXdtiLynlUbLp9F+Pu69iEJH0o3r2MUJbi0nKW3596qCEq3R8/ac3G9St93L7KbchnCcSkuXWUcUxKbX64yllfPOiuD+j4KS1sZ17OzslzcrzK6u8nKlzFeVVFpKeM85ZTWMtRrVCWVEb97EtFyDhlQknzaVoa+Z+n0xfAn3dTJF1xFNXzFlvRSbr7ko5bMxyxa4Xu2pJO8Pwg0jRQ+63v3Jo/Gpx3iGA8fd1ZlZL7v0kXhE8+eNNH5zEUQ8/ChRxNDufjYSQn95nt3HRQ+edVA6nz158oCmHz4K/z65tOPK/j4/Dny+vp+XHGXCMES84swfPYc70wkjnC/xOLeg000XqG+icca57yIyBrlTlC2FOJKXOb4lklk9vBuYrPm0LaX8CyRfQnQEtZOjNaoEqUlpP2ECVNEidQUToL1PKTHM5SdeE2RPAHT4rgJ2Z6DmIjaFMKduE0RJHJz+AjekqXHFrpJ/JbIEcEpbJMQ7mEjiHvM0ooi5pBNwrgE7CWSny1cBHPRHrdYtXA6I5UI6BKnRETXOBHTW5EeWUO0iesSIQK7xSevyGIPzyS0t/AQ3Dk2ZUYXc2he4jtFhgAvcbkJ8T0sBHkOSo0ylpBUwnxEJBHoNSAj0pjCQbCXLD32WNRwY  this plan\u003c/a>\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"section-space light-section\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading-row compact\">\u003cdiv>\u003cdiv class=\"section-kicker\">ADDITIONAL SUPPORT\u003c/div>\u003ch2>More ways to strengthen your French.\u003c/h2>\u003c/div>\u003cp class=\"section-sidecopy\">Optional services for learners with specific goals.\u003c/p>\u003c/div>\u003cdiv class=\"support-grid\">\u003carticle class=\"support-card\">\u003ch3>Conversation practice\u003c/h3>\u003cp>Extra speaking sessions focused on fluency, confidence, and natural expression.\u003c/p>\u003c/article>\u003carticle class=\"support-card\">\u003ch3>Exam preparation\u003c/h3>\u003cp>Targeted support for DELF, DALF, and other formal learning goals.\u003c/p>\u003c/article>\u003carticle class=\"support-card\">\u003ch3>Professional French\u003c/h3>\u003cp>Refine your communication for work, meetings, interviews, and business contexts.\u003c/p>\u003c/article>\u003carticle class=\"support-card\">\u003ch3>Team learning\u003c/h3>\u003cp>French training for organisations, teams, and custom group programs.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pricing-trial section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"trial-strip refined-strip\">\u003cdiv>\u003cspan class=\"tag\">START WITH CLARITY\u003c/span>\u003ch2>Try a first lesson before you commit.\u003c/h2>\u003cp>Book a free introductory lesson and get a feel for the teaching style, pace, and format that suit you best.\u003c/p>\u003c/div>\u003ca class=\"button button-primary\" href=\"contact.html?service=free-trial\">Book a free lesson\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"container\">\u003cdiv class=\"footer-upper\">\u003cdiv class=\"footer-brand\">\u003ca aria-label=\"YoLingo home\" class=\"brand\" href=\"index.html\">\u003cspan class=\"brand-icon\" info\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"contact-method-new\">\u003cdiv>\u003cspan>PHONE / WHATSAPP\u003c/span>\u003ca href=\"tel:+18182621520\">+1 818 262 1520\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"contact-method-new\">\u003cdiv>\u003cspan>RESPONSE TIME\u003c/span>\u003cp>Usually within 24 hours, and often faster on WhatsApp during business hours.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"form-card\">\u003cdiv class=\"form-top\">\u003cspan class=\"tag\">SEND A MESSAGE\u003c/span>\u003ch2>Book your free lesson or ask a question\u003c/h2>\u003cp>Tell us a little about your goals and we will reply personally.\u003c/p>\u003c/div>\u003cform action=\"https://formspree.io/f/mlgrrrpd\" id=\"contactForm\" method=\"POST\">\u003cinput name=\"_subject\" type=\"hidden\" value=\"New contact form submission - YoLingo\"/>\u003cinput id=\"language\" name=\"language\" type=\"hidden\" value=\"french\"/>\u003cinput aria-hidden=\"true\" autocomplete=\"off\" class=\"visually-hidden\" name=\"_gotcha\" tabindex=\"-1\" type=\"text\"/>\u003cdiv class=\"form-two\">\u003cdiv class=\"form-group\">\u003clabel for=\"name\">Your name \u003cspan>*\u003c/span>\u003c/label>\u003cinput id=\"name\" maxlength=\"100\" minlength=\"2\" name=\"name\" placeholder=\"Your full name\" required=\"\" type=\"text\"/>\u003c/div>\u003cdiv class=\"form-group\">\u003clabel for=\"email\">Email address \u003cspan>*\u003c/span>\u003c/label>\u003cinput id=\"email\" name=\"email\" placeholder=\"you@example.com\" required=\"\" type=\"email\"/>\u003c/div>\u003c/div>\u003cdiv class=\"form-two\">\u003cdiv class=\"form-group\">\u003clabel for=\"level\">Current level\u003c/label>\u003cselect id=\"level\" name=\"level\">\u003coption value=\"\">Choose your level\u003c/option>\u003coption value=\"beginner\">Complete beginner\u003c/option>\u003coption value=\"a1\">A1 / Elementary\u003c/option>\u003coption value=\"a2\">A2 / Basic\u003c/option>\u003coption value=\"b1\">B1 / Intermediate\u003c/option>\u003coption value=\"b2\">B2 / Upper intermediate\u003c/option>\u003coption value=\"unsure\">Not sure yet\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-group\">\u003clabel for=\"goal\">What are you looking for?\u003c/label>\u003cselect id=\"goal\" name=\"goal\">\u003coption value=\"\">Choose an option\u003c/option>\u003coption value=\"free-trial\">A free introductory lesson\u003c/option>\u003coption value=\"group-lessons\">Group classes\u003c/option>\u003coption value=\"private-lessons\">Private lessons\u003c/option>\u003coption value=\"intensive-course\">An intensive course\u003c/option>\u003coption value=\"exam-prep\">Exam preparation\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"form-group\">\u003clabel for=\"schedule\">Preferred schedule \u003cspan>*\u003c/span>\u003c/label>\u003cselect id=\"schedule\" name=\"schedule\" required=\"\">\u003coption value=\"\">Choose what works for you\u003c/option>\u003coption value=\"morning\">Mornings (EST)\u003c/option>\u003coption value=\"afternoon\">Afternoons (EST)\u003c/option>\u003coption value=\"evening\">Evenings (EST)\u003c/option>\u003coption value=\"weekend\">Weekends\u003c/option>\u003coption value=\"flexible\">I am flexible\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-group\">\u003clabel for=\"message\">Message \u003cspan>*\u003c/span>\u003c/label>\u003ctextarea id=\"message\" maxlength=\"1000\" minlength=\"20\" name=\"message\" placeholder=\"Tell us about your goals, experience level, and what kind of lessons you are looking for.\" required=\"\" rows=\"5\">\u003c/textarea>\u003cdiv class=\"char-counter\">\u003cspan id=\"charCount\">0\u003c/span>/1000\u003c/div>\u003c/div>\u003clabel class=\"privacy-consent\">\u003cinput id=\"privacy\" name=\"privacy\" required=\"\" type=\"checkbox\"/>\u003cspan>I agree to the \u003ca href=\"privacy.html\">Privacy Policy\u003c/a> and to be contacted about my inquiry.\u003c/span>\u003c/label>\u003cbutton class=\"button button-primary form-submit\" id=\"submitBtn\" type=\"submit\">Send message\u003c/button>\u003cdiv class=\"form-status\" hidden=\"\" id=\"loadingMessage\">Sending your message…\u003c/div>\u003cdiv class=\"form-status success\" hidden=\"\" id=\"successMessage\">Thank you. Your message is on its way.\u003c/div>\u003cdiv class=\"form-status error\" hidden=\"\" id=\"errorMessage\">Something went wrong. Please try again or email us directly.\u003c/div>\u003cdiv class=\"form-footnote\">We only use your details to respond to your inquiry.\u003c/div>\u003c/form>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"faq-section section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading-row compact\">\u003cdiv>\u003cdiv class=\"section-kicker\">FAQ\u003c/div>\u003ch2>Common questions\u003c/h2>\u003c/div>\u003cp class=\"section-sidecopy\">A few practical details before you get started.\u003c/p>\u003c/div>\u003cdiv class=\"faq-list\">\u003cdetails class=\"faq-entry\">\u003csummary>Do you offer a free introductory lesson?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>Yes. The introductory lesson helps you meet us, discuss your goals, and see whether the format feels right for you.\u003c/p>\u003c/details>\u003cdetails class=\"faq-entry\">\u003csummary>Do I need prior knowledge of French?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>No. We work with complete beginners as well as learners returning to French after a break.\u003c/p>\u003c/details>\u003cdetails class=\"faq-entry\">\u003csummary>Are all classes online?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>Yes. YoLingo operates online, which allows for flexible scheduling and access from anywhere.\u003c/p>\u003c/details>\u003cdetails class=\"faq-entry\">\u003csummary>Can I choose between group and private formats?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>Yes. You can choose the plan that fits you best on the \u003ca href=\"pricing.html\">pricing page\u003c/a>.\u003c/p>\u003c/details>\u003c/div>\u003c/di "Open navigation\" class=\"menu-toggle\" id=\"menuToggle\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\u003cnav aria-label=\"Main navigation\" class=\"nav-links\" id=\"navLinks\">\u003ca data-page=\"index\" href=\"index.html\">Home\u003c/a>\u003ca data-page=\"pricing\" href=\"pricing.html\">Pricing\u003c/a>\u003ca data-page=\"contact\" href=\"contact.html\">Contact\u003c/a>\u003ca class=\"nav-cta\" href=\"contact.html?service=free-trial\">Book a free lesson\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain>\u003csection class=\"legal-section section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"legal-card\">\u003ch1>Privacy Policy\u003c/h1>\u003cp>How YoLingo handles contact form information and communication preferences.\u003c/p>\n\u003ch2>Information we collect\u003c/h2>\n\u003cp>When you contact YoLingo, we collect the information you submit, such as your name, email address, phone number, language interest, current level, preferred schedule, and message.\u003c/p>\n\u003ch2>How we use it\u003c/h2>\n\u003cp>We use your information to reply to your inquiry, schedule trial lessons, recommend the right learning option, and provide student support.\u003c/p>\n\u003ch2>Sharing\u003c/h2>\n\u003cp>We do not sell your personal information. We only use trusted service providers, such as form and email tools, when needed to receive and respond to your message.\u003c/p>\n\u003ch2>Your choices\u003c/h2>\n\u003cp>You can ask us to update or delete your contact information, and you can opt out of marketing messages at any time.\u003c/p>\n\u003ch2>Contact\u003c/h2>\n\u003cp>Questions about this page? Email \u003ca href=\"mailto:contact@yolingo.info\">contact@yolingo.info\u003c/a>.\u003c/p>\n\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"container\">\u003cdiv class=\"footer-upper\">\u003cdiv class=\"footer-brand\">\u003ca aria-label=\"YoLingo home\" class=\"brand\" href=\" der>\u003cmain>\u003csection class=\"legal-section section-space\">\u003cdiv class=\"container\">\u003cdiv class=\"legal-card\">\u003ch1>Refund Policy\u003c/h1>\u003cp>A clear overview of how cancellations, pauses, and refunds are handled.\u003c/p>\n\u003ch2>Free trial\u003c/h2>\n\u003cp>Free trial or consultation sessions do not require payment and can be rescheduled by contacting YoLingo in advance.\u003c/p>\n\u003ch2>Paid lessons\u003c/h2>\n\u003cp>Refund and rescheduling options depend on the lesson package, teacher availability, and notice period. We confirm the exact policy before payment.\u003c/p>\n\u003ch2>Cancellations\u003c/h2>\n\u003cp>Please contact us as early as possible if you need to cancel or reschedule. This helps us protect both student and teacher time.\u003c/p>\n\u003ch2>Plan changes\u003c/h2>\n\u003cp>If your schedule or learning goals change, contact us and we will help you choose the best available adjustment.\u003c/p>\n\u003ch2>Contact\u003c/h2>\n\u003cp>Questions about this page? Email \u003ca href=\"mailto:contact@yolingo.info\">contact@yolingo.info\u003c/a>.\u003c/p>\n\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"container\">\u003cdiv class=\"footer-upper\">\u003cdiv class=\"footer-brand\">\u003ca aria-label=\"YoLingo home\" class=\"brand\" href=\"index.html\">\u003cspan class=\"brand-icon\">\u003cimg alt=\"Yo, the YoLingo mascot\" height=\"43\" src=\"data:image/webp;base64,UklGRjSEAABXRUJQVlA4WAoAAAAQAAAAfAIAxAIAQUxQSL0MAAABhyAQIBzwP2whIpJOCuM2ksLMbv9dc8DdkvwjYgK4dmIBWCnA0K16iXFri5sb3P6MB3P8Pc7x9zjHova86gAHATgyR5IyMrVGsGRSBoAkFFEGbJljWzBxOcFhlCGhzqGLhxCx2hdam2hgiMCcX6Vo23bctjmYCM7E//+uZFsEHuDHl6SN6P8ESHDbSJIk5133+P8/nq3IjChjFojof1CQJMltJFlLtADQ8f8Hn9i9O1TmqYj+TwD/+/9/b5d2zuGXzzmuq/fOOed936cWK/Eh5e0sVZ9zDqzZq3lM63mVpuecM/lFmvejCHqeNWoxiXXdtiLynlUbLp9F+Pu69iEJH0o3r2MUJbi0nKW3596qCEq3R8/ac3G9St93L7KbchnCcSkuXWUcUxKbX64yllfPOiuD+j4KS1sZ17OzslzcrzK6u8nKlzFeVVFpKeM85ZTWMtRrVCWVEb97EtFyDhl
